name: Atualizar dados SISVAN

on:
  schedule:
    - cron: "0 6 * * 1" # Toda segunda-feira às 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar script de coleta da API SISVAN
        run: python scripts/update_sisvan.py --target 400

      - name: Salvar atualizacao no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sisvan-pr.json data/sisvan-pr.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados agregados do SISVAN (Parana)"
            git push
          else
            echo "Nenhuma alteracao nos dados."
          fi
