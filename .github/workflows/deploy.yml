name: Deploy NutriData to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public dataset
        run: |
          node -e '
            const fs = require("fs");
            const file = "public/data/sisvan-pr.json";
            if (!fs.existsSync(file)) {
              console.error("Arquivo " + file + " nao encontrado.");
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            const total = data?.summary?.total_records || 0;
            if (total <= 0) {
              console.error("Dataset sem registros validos.");
              process.exit(1);
            }
            console.log("Dataset validado com sucesso: " + total + " registros no Parana.");
          '

      - name: Build static dashboard
        run: npm run build

      - name: Validate build output
        run: |
          test -s dist/index.html
          test -s dist/data/sisvan-pr.json
          echo "Build pronto para publicacao no GitHub Pages."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
