name: NutriData — build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: nutridata-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const activeStatuses = new Set(["queued", "in_progress", "pending", "waiting", "requested"]);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100
            });
            const stale = runs.filter(run =>
              run.id !== context.runId &&
              activeStatuses.has(run.status) &&
              (run.name.includes("NutriData") || run.name === "pages build and deployment")
            );
            for (const run of stale) {
              core.info(`Cancelando execução antiga ${run.id}: ${run.name}`);
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
            }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore SISVAN dataset cache
        id: sisvan-cache
        uses: actions/cache@v4
        with:
          path: .cache/sisvan
          key: sisvan-pr-v2-${{ github.run_id }}
          restore-keys: |
            sisvan-pr-v2-

      - name: Check cached SISVAN dataset
        id: cache-check
        run: |
          if [ -s .cache/sisvan/sisvan-pr.json.gz ] && [ -s .cache/sisvan/metadata.json ]; then
            echo "has_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SISVAN pipeline dependencies
        if: github.event_name != 'push' || steps.cache-check.outputs.has_cache != 'true'
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Refresh official SISVAN dataset
        if: github.event_name != 'push' || steps.cache-check.outputs.has_cache != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/update_sisvan.py

      - name: Restore cached data or prepare safe fallback
        if: always()
        run: |
          mkdir -p public/data
          if [ ! -s public/data/sisvan-pr.json.gz ] && [ -s .cache/sisvan/sisvan-pr.json.gz ]; then
            cp .cache/sisvan/sisvan-pr.json.gz public/data/sisvan-pr.json.gz
            cp .cache/sisvan/metadata.json public/data/metadata.json
            echo "Dataset restaurado do cache."
          fi
          python - <<'PY'
          import gzip
          import json
          import shutil
          from pathlib import Path

          data = Path("public/data/sisvan-pr.json.gz")
          metadata = Path("public/data/metadata.json")
          valid = False
          try:
              with gzip.open(data, "rt", encoding="utf-8") as source:
                  records = json.load(source)
              valid = isinstance(records, list) and len(records) > 0
              if valid:
                  with metadata.open(encoding="utf-8") as source:
                      json.load(source)
          except Exception as error:
              print(f"Base não validada: {error}")

          if valid:
              Path(".cache/sisvan").mkdir(parents=True, exist_ok=True)
              shutil.copy2(data, ".cache/sisvan/sisvan-pr.json.gz")
              shutil.copy2(metadata, ".cache/sisvan/metadata.json")
              print(f"Base validada: {len(records)} registros.")
          else:
              with gzip.open(data, "wt", encoding="utf-8") as output:
                  json.dump([], output)
              metadata.write_text(json.dumps({
                  "source": "Ministério da Saúde — SISVAN",
                  "uf": "PR",
                  "records": 0,
                  "status": "Base de contingência ainda não sincronizada."
              }, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
              print("Publicação preservada; dashboard exibirá aviso de dados indisponíveis.")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React dashboard
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
