name: Update SISVAN data and deploy NutriData

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data pipeline dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Download and prepare public SISVAN data
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scripts/update_sisvan.py
          if [ ! -s public/data/sisvan-pr.json.gz ]; then
            mkdir -p public/data
            python - <<'PY'
          import gzip, json
          from pathlib import Path
          with gzip.open("public/data/sisvan-pr.json.gz", "wt", encoding="utf-8") as f:
              json.dump([], f)
          Path("public/data/metadata.json").write_text(json.dumps({
              "source": "Ministério da Saúde — SISVAN",
              "uf": "PR",
              "records": 0,
              "status": "Dados temporariamente indisponíveis; publicação do site preservada."
          }, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
