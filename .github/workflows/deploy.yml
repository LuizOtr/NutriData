name: Update SISVAN data and deploy NutriData

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nutridata-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cache prepared SISVAN dataset
        uses: actions/cache@v4
        with:
          path: .cache/sisvan
          key: sisvan-pr-${{ github.run_id }}
          restore-keys: |
            sisvan-pr-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data pipeline dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Download and prepare public SISVAN data
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ -s .cache/sisvan/sisvan-pr.json.gz ]; then
            mkdir -p public/data
            cp .cache/sisvan/sisvan-pr.json.gz public/data/sisvan-pr.json.gz
            cp .cache/sisvan/metadata.json public/data/metadata.json
            echo "Base SISVAN restaurada do cache."
          elif [ ! -s public/data/sisvan-pr.json.gz ]; then
            python scripts/update_sisvan.py || true
            if [ -s public/data/sisvan-pr.json.gz ] && [ -s public/data/metadata.json ]; then
              RECORDS=$(python -c "import json; print(json.load(open('public/data/metadata.json')).get('records', 0))")
              if [ "$RECORDS" -gt 0 ]; then
                mkdir -p .cache/sisvan
                cp public/data/sisvan-pr.json.gz .cache/sisvan/sisvan-pr.json.gz
                cp public/data/metadata.json .cache/sisvan/metadata.json
                echo "Base SISVAN validada e preparada para cache."
              fi
            fi
          fi

      - name: Ensure data files exist for the frontend
        if: always()
        run: |
          mkdir -p public/data
          if [ ! -s public/data/sisvan-pr.json.gz ]; then
            python - <<'PY'
          import gzip, json
          from pathlib import Path
          with gzip.open("public/data/sisvan-pr.json.gz", "wt", encoding="utf-8") as output:
              json.dump([], output)
          Path("public/data/metadata.json").write_text(json.dumps({
              "source": "Ministério da Saúde — SISVAN",
              "uf": "PR",
              "records": 0,
              "status": "Base ainda não sincronizada; execute a atualização manual."
          }, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
