name: NutriData — build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nutridata-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SISVAN pipeline dependencies
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Download and process SISVAN
        run: python scripts/update_sisvan.py

      - name: Validate published dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/dados/sisvan.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Arquivo public/dados/sisvan.json ausente ou vazio.")
          with path.open(encoding="utf-8") as source:
              records = json.load(source)
          if not isinstance(records, list) or not records or not all(isinstance(row, dict) for row in records):
              raise SystemExit("JSON inválido ou sem registros.")
          print(f"JSON válido: {len(records)} registros.")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React dashboard
        run: npm run build

      - name: Verify dataset in build output
        run: test -s dist/dados/sisvan.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
